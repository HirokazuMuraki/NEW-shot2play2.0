Responsibility Model
</text>


<!-- Identity -->

<rect x="1215"
      y="620"
      width="560"
      height="145"
      fill="white"
      stroke="black"
      stroke-width="3"/>

<text x="1495"
      y="665"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="21"
      font-weight="bold">
Identity
</text>

<text x="1495"
      y="705"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="15">
Who is the subject?
</text>

<text x="1495"
      y="735"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="14">
Established by Authentication
</text>


<!-- Entitlement -->

<rect x="1215"
      y="795"
      width="560"
      height="145"
      fill="white"
      stroke="black"
      stroke-width="3"/>

<text x="1495"
      y="840"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="21"
      font-weight="bold">
Entitlement
</text>

<text x="1495"
      y="880"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="15">
What is the subject eligible to use?
</text>

<text x="1495"
      y="910"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="14">
Capability / Scope / Validity
</text>


<!-- Policy -->

<rect x="1215"
      y="970"
      width="560"
      height="145"
      fill="white"
      stroke="black"
      stroke-width="3"/>

<text x="1495"
      y="1015"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="21"
      font-weight="bold">
Policy
</text>

<text x="1495"
      y="1055"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="15">
Under what conditions is use permitted?
</text>

<text x="1495"
      y="1085"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="14">
Rules / Context / Conditions
</text>


<!-- Authorization -->

<rect x="1215"
      y="1145"
      width="560"
      height="175"
      fill="white"
      stroke="black"
      stroke-width="3"/>

<text x="1495"
      y="1190"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="21"
      font-weight="bold">
Authorization
</text>

<text x="1495"
      y="1230"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="15">
Is the requested action permitted?
</text>

<text x="1495"
      y="1260"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="18"
      font-weight="bold">
ALLOW / DENY
</text>


<!-- ========================================================= -->
<!-- Right Lower: Security Controls -->
<!-- ========================================================= -->

<rect x="1160"
      y="1430"
      width="670"
      height="460"
      rx="12"
      fill="white"
      stroke="black"
      stroke-width="4"/>

<text x="1495"
      y="1480"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="25"
      font-weight="bold">
Authorization Security Controls
</text>


<text x="1495"
      y="1540"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="18">
Entitlement Revocation
</text>

<text x="1495"
      y="1575"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="18">
↓
</text>

<text x="1495"
      y="1610"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="18">
Expiration Check
</text>

<text x="1495"
      y="1645"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="18">
↓
</text>

<text x="1495"
      y="1680"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="18">
Policy Evaluation
</text>

<text x="1495"
      y="1715"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="18">
↓
</text>

<text x="1495"
      y="1750"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="18"
      font-weight="bold">
Authorization Decision
</text>

<text x="1495"
      y="1810"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="14">
Revoked or expired entitlement SHALL NOT authorize service access.
</text>


