NEW-shot2play Protocol Suite Version 2.0
</text>

<text x="950" y="138"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="16">
Authentication → Authorization → Enforcement → Consumption → Entitlement → Audit
</text>


