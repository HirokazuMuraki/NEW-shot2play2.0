    <rect x="250"
          y="910"
          width="500"
          height="120"
          fill="white"
          stroke="black"
          stroke-width="3"/>

    <text x="500"
          y="950"
          text-anchor="middle"
          font-family="Arial, sans-serif"
          font-size="24"
          font-weight="bold">
