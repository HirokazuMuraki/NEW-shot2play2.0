    <text x="500"
          y="985"
          text-anchor="middle"
          font-family="Arial, sans-serif"
          font-size="18">
        Policy Object
    </text>

    <text x="500"
          y="1015"
          text-anchor="middle"
          font-family="Arial, sans-serif"
          font-size="18">
        Policy Evaluation Engine
    </text>


    <line x1="500"
          y1="1030"
          x2="500"
          y2="1090"
          stroke="black"
          stroke-width="3"/>

    <polygon points="490,1085 510,1085 500,1100"
             fill="black"/>


    <!-- Authorization Layer -->

    <rect x="250"
          y="1100"
          width="500"
          height="120"
          fill="white"
          stroke="black"
          stroke-width="3"/>

    <text x="500"
          y="1140"
          text-anchor="middle"
          font-family="Arial, sans-serif"
          font-size="24"
          font-weight="bold">
        Authorization Layer
    </text>

    <text x="500"
          y="1175"
          text-anchor="middle"
          font-family="Arial, sans-serif"
          font-size="18">
        Authorization Object
    </text>

    <text x="500"
          y="1205"
          text-anchor="middle"
          font-family="Arial, sans-serif"
          font-size="16">
        Conditional Authorization
    </text>


    <line x1="500"
          y1="1220"
          x2="500"
          y2="1280"
          stroke="black"
          stroke-width="3"/>

    <polygon points="490,1275 510,1275 500,1290"
             fill="black"/>


    <!-- Application Layer -->

    <rect x="250"
          y="1290"
          width="500"
          height="100"
          fill="white"
          stroke="black"
          stroke-width="2"/>

    <text x="500"
          y="1330"
          text-anchor="middle"
          font-family="Arial, sans-serif"
          font-size="24"
          font-weight="bold">
        Application Layer
    </text>

    <text x="500"
          y="1365"
          text-anchor="middle"
          font-family="Arial, sans-serif"
          font-size="18">
        Service Object
    </text>


    <!-- Innovation Area -->

    <rect x="820"
          y="720"
          width="300"
          height="300"
          fill="white"
          stroke="black"
          stroke-width="2"/>

    <text x="970"
          y="770"
          text-anchor="middle"
          font-family="Arial, sans-serif"
          font-size="20"
          font-weight="bold">
        Version 2.0
    </text>

    <text x="970"
          y="805"
          text-anchor="middle"
          font-family="Arial, sans-serif"
          font-size="18">
        Innovation Area
    </text>

    <text x="850"
          y="860"
          font-family="Arial, sans-serif"
          font-size="16">
        • Entitlement Object
    </text>

    <text x="850"
          y="900"
          font-family="Arial, sans-serif"
          font-size="16">
        • Policy Evaluation Engine
    </text>

    <text x="850"
          y="940"
          font-family="Arial, sans-serif"
          font-size="16">
        • Conditional Authorization
    </text>

    <text x="850"
          y="980"
          font-family="Arial, sans-serif"
          font-size="16">
        • Cross-Service Reuse
    </text>


    <!-- Footer -->

    <text x="600"
          y="1600"
          text-anchor="middle"
          font-family="Arial, sans-serif"
          font-size="18">
        Authentication → Entitlement → Policy → Authorization → Service
    </text>


</svg>
