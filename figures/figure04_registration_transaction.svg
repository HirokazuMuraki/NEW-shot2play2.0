Credential
</text>

<text x="1020"
      y="1210"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="20">
↓
</text>


<text x="1020"
      y="1260"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="18">
Entitlement Context
</text>

<text x="1020"
      y="1310"
