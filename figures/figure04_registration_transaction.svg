<?xml version="1.0" encoding="UTF-8"?>

<svg xmlns="http://www.w3.org/2000/svg"
     width="1400"
     height="1700"
     viewBox="0 0 1400 1700">

<title>Figure04 Registration Transaction</title>

<desc>
NEW-shot2play Protocol Suite Version 2.0
Initial Credential and Identity Registration Model
</desc>


<rect x="0"
