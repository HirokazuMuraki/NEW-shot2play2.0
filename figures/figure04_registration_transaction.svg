      font-family="Arial, sans-serif"
      font-size="22"
      font-weight="bold">
Server
</text>

<text x="1020" y="875"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="16">
Verification Data
</text>



<!-- Version 2.0 Extension -->

<rect x="820"
      y="1030"
      width="400"
      height="400"
      fill="white"
      stroke="black"
      stroke-width="3"/>

<text x="1020"
      y="1080"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="22"
      font-weight="bold">
Version 2.0 Extension
</text>


<text x="1020"
      y="1160"
      text-anchor="middle"
      font-family="Arial, sans-serif"
