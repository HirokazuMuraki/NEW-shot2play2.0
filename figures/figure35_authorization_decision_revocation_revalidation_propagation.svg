  </text>

  <rect x="105" y="405"
        width="280"
        height="60"
        rx="8" ry="8"
        fill="white"
        stroke="#444"
        stroke-width="2"/>

  <text x="245" y="442"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
