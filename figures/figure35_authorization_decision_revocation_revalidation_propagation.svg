  </text>

  <text x="1355" y="1335"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="13">
    Stale or inconsistent state is rejected.
  </text>

  <!-- ====================================================== -->
  <!-- FOOTER -->
  <!-- ====================================================== -->

  <text x="800" y="1430"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="14">
    An invalidated decision is replaced only after successful revalidation and new authorization evaluation.
  </text>

