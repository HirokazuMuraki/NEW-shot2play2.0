  </text>

  <!-- Inputs → Revalidation -->
  <path d="M1180 915
           L1120 915
           L1120 756
           L975 756"
        fill="none"
        stroke="#555"
        stroke-width="2"
        marker-end="url(#arrow)"/>

  <!-- ====================================================== -->
  <!-- SECURITY INVARIANT -->
  <!-- ====================================================== -->

  <rect x="1180" y="1130"
        width="350"
        height="245"
        rx="14" ry="14"
        fill="white"
        stroke="#666"
        stroke-width="2"/>

  <text x="1355" y="1167"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="20"
        font-weight="bold">
