  <rect x="1215" y="610"
        width="280"
        height="60"
        rx="8" ry="8"
        fill="white"
        stroke="#444"
        stroke-width="2"/>

  <text x="1355" y="647"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="15">
    Application Service
  </text>

