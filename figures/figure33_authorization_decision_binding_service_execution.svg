<svg xmlns="http://www.w3.org/2000/svg"
     width="1500"
     height="1350"
     viewBox="0 0 1500 1350">

  <title>Figure33 — Authorization Decision Binding to Service Execution</title>

  <desc>
    Authorization Decision binding and enforcement model.
    An Authorization Decision is bound to the request, subject,
    action, resource, service, entitlement, policy, transaction,
    and validity state before protected service execution.
  </desc>

  <defs>
    <marker id="arrow"
            markerWidth="10"
            markerHeight="10"
            refX="9"
            refY="5"
            orient="auto"
            markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z"/>
    </marker>
  </defs>

  <!-- ====================================================== -->
  <!-- Canvas                                                   -->
  <!-- ====================================================== -->

  <rect x="0" y="0"
        width="1500"
        height="1350"
        fill="white"/>

  <!-- ====================================================== -->
  <!-- Title                                                    -->
  <!-- ====================================================== -->

  <text x="750" y="45"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="28"
        font-weight="bold">
    Figure33 — Authorization Decision Binding to Service Execution
  </text>

  <text x="750" y="75"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="16">
    Decision applicability, enforcement verification, and protected execution
  </text>

  <!-- ====================================================== -->
  <!-- Main Flow Boundary                                      -->
  <!-- ====================================================== -->

  <rect x="70" y="105"
        width="860"
        height="1180"
        rx="14"
        ry="14"
        fill="white"
        stroke="#666"
        stroke-width="2"/>

  <text x="500" y="140"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="21"
        font-weight="bold">
    Decision-to-Execution Binding
  </text>

  <!-- ====================================================== -->
  <!-- Authorization Request                                   -->
  <!-- ====================================================== -->

  <rect x="200" y="175"
        width="600"
        height="75"
        rx="10"
        ry="10"
        fill="white"
        stroke="#333"
        stroke-width="2"/>

  <text x="500" y="207"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="19"
        font-weight="bold">
    Authorization Request
  </text>

  <text x="500" y="232"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="14">
    Requested Action / Resource / Service
  </text>

  <!-- Arrow -->
  <line x1="500" y1="250"
        x2="500" y2="285"
        stroke="#333"
        stroke-width="2"
        marker-end="url(#arrow)"/>

  <!-- ====================================================== -->
  <!-- Authorization Evaluation                                -->
  <!-- ====================================================== -->

  <rect x="200" y="285"
        width="600"
        height="75"
        rx="10"
        ry="10"
        fill="white"
        stroke="#333"
        stroke-width="2"/>

  <text x="500" y="317"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="19"
        font-weight="bold">
    Authorization Evaluation
  </text>

  <text x="500" y="342"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="14">
    Identity + Entitlement + Policy + Context
  </text>

  <!-- Arrow -->
  <line x1="500" y1="360"
        x2="500" y2="395"
        stroke="#333"
        stroke-width="2"
        marker-end="url(#arrow)"/>

  <!-- ====================================================== -->
  <!-- Authorization Decision                                  -->
  <!-- ====================================================== -->

  <rect x="200" y="395"
        width="600"
        height="75"
        rx="10"
        ry="10"
        fill="white"
        stroke="#222"
        stroke-width="3"/>

  <text x="500" y="427"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="20"
        font-weight="bold">
    Authorization Decision
  </text>

  <text x="500" y="452"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="14">
    Allow / Deny + Decision State
  </text>

  <!-- Arrow -->
  <line x1="500" y1="470"
        x2="500" y2="505"
        stroke="#222"
        stroke-width="2"
        marker-end="url(#arrow)"/>

  <!-- ====================================================== -->
  <!-- Decision Binding                                        -->
  <!-- ====================================================== -->

  <rect x="140" y="505"
        width="720"
        height="330"
        rx="12"
        ry="12"
        fill="white"
        stroke="#222"
        stroke-width="3"/>

  <text x="500" y="540"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="21"
        font-weight="bold">
    Decision Binding
  </text>

  <text x="500" y="565"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="14">
    Applicability of the decision to the current operation
  </text>

  <!-- Binding fields -->

  <rect x="175" y="590"
        width="310"
        height="55"
        rx="8"
        ry="8"
        fill="white"
        stroke="#555"
        stroke-width="2"/>

  <text x="330" y="623"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="16">
    Subject Binding
  </text>

  <rect x="515" y="590"
        width="310"
        height="55"
        rx="8"
        ry="8"
        fill="white"
        stroke="#555"
        stroke-width="2"/>

  <text x="670" y="623"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="16">
    Action Binding
  </text>

  <rect x="175" y="660"
        width="310"
        height="55"
        rx="8"
        ry="8"
        fill="white"
        stroke="#555"
        stroke-width="2"/>

  <text x="330" y="693"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="16">
    Resource Binding
  </text>

  <rect x="515" y="660"
        width="310"
        height="55"
        rx="8"
        ry="8"
        fill="white"
        stroke="#555"
        stroke-width="2"/>

  <text x="670" y="693"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="16">
    Service Binding
  </text>

  <rect x="175" y="730"
        width="310"
        height="55"
        rx="8"
        ry="8"
        fill="white"
        stroke="#555"
        stroke-width="2"/>

  <text x="330" y="763"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="16">
    Entitlement / Policy Binding
  </text>

  <rect x="515" y="730"
        width="310"
        height="55"
        rx="8"
        ry="8"
        fill="white"
        stroke="#555"
        stroke-width="2"/>

  <text x="670" y="763"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="16">
    Transaction / Validity Binding
  </text>

  <!-- Arrow -->
  <line x1="500" y1="835"
        x2="500" y2="870"
        stroke="#222"
        stroke-width="2"
        marker-end="url(#arrow)"/>

  <!-- ====================================================== -->
  <!-- Enforcement Verification                                -->
  <!-- ====================================================== -->

  <rect x="200" y="870"
        width="600"
        height="90"
        rx="12"
        ry="12"
        fill="white"
        stroke="#222"
        stroke-width="3"/>

  <text x="500" y="907"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="20"
        font-weight="bold">
    Enforcement Verification
  </text>

  <text x="500" y="935"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="14">
    Required binding conditions remain valid
  </text>

  <!-- Arrow -->
  <line x1="500" y1="960"
        x2="500" y2="995"
        stroke="#222"
        stroke-width="2"
        marker-end="url(#arrow)"/>

  <!-- ====================================================== -->
  <!-- Decision Result                                         -->
  <!-- ====================================================== -->

  <rect x="250" y="995"
        width="500"
        height="70"
        rx="10"
        ry="10"
        fill="white"
        stroke="#222"
        stroke-width="3"/>

  <text x="500" y="1037"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="19"
        font-weight="bold">
    Enforcement Result
  </text>

  <!-- Split -->
  <path d="M500 1065 L350 1065 L350 1095"
        fill="none"
        stroke="#333"
        stroke-width="2"
        marker-end="url(#arrow)"/>

  <path d="M500 1065 L650 1065 L650 1095"
        fill="none"
        stroke="#333"
        stroke-width="2"
        marker-end="url(#arrow)"/>

  <!-- Allow -->
  <rect x="250" y="1095"
        width="200"
        height="60"
        rx="9"
        ry="9"
        fill="white"
        stroke="#333"
        stroke-width="2"/>

  <text x="350" y="1132"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="18"
        font-weight="bold">
    ALLOW
  </text>

  <!-- Deny -->
  <rect x="550" y="1095"
        width="200"
        height="60"
        rx="9"
        ry="9"
        fill="white"
        stroke="#333"
        stroke-width="2"/>

  <text x="650" y="1132"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="18"
        font-weight="bold">
    DENY / FAIL-CLOSED
  </text>

  <!-- Allow → execution -->
  <line x1="350" y1="1155"
        x2="350" y2="1190"
        stroke="#333"
        stroke-width="2"
        marker-end="url(#arrow)"/>

  <!-- Protected Service Execution -->
  <rect x="200" y="1190"
        width="600"
        height="70"
        rx="12"
        ry="12"
        fill="white"
        stroke="#222"
        stroke-width="3"/>

  <text x="500" y="1232"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="20"
        font-weight="bold">
    Protected Service Execution
  </text>

  <!-- ====================================================== -->
  <!-- RIGHT SIDE: FAILURE CONDITIONS                          -->
  <!-- ====================================================== -->

  <rect x="980" y="105"
        width="450"
        height="1180"
        rx="14"
        ry="14"
        fill="white"
        stroke="#666"
        stroke-width="2"/>

  <text x="1205" y="140"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="21"
        font-weight="bold">
    Binding Failure Conditions
  </text>

  <text x="1205" y="166"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="14">
    Any applicable mismatch prevents protected execution
  </text>

  <!-- Failure 1 -->
  <rect x="1025" y="205"
        width="360"
        height="55"
        rx="8"
        ry="8"
        fill="white"
        stroke="#555"
        stroke-width="2"/>

  <text x="1205" y="239"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="15">
    Subject Mismatch
  </text>

  <!-- Failure 2 -->
  <rect x="1025" y="285"
        width="360"
        height="55"
        rx="8"
        ry="8"
        fill="white"
        stroke="#555"
        stroke-width="2"/>

  <text x="1205" y="319"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="15">
    Action Mismatch
  </text>

  <!-- Failure 3 -->
  <rect x="1025" y="365"
        width="360"
        height="55"
        rx="8"
        ry="8"
        fill="white"
        stroke="#555"
        stroke-width="2"/>

  <text x="1205" y="399"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="15">
    Resource Mismatch
  </text>

  <!-- Failure 4 -->
  <rect x="1025" y="445"
        width="360"
        height="55"
        rx="8"
        ry="8"
        fill="white"
        stroke="#555"
        stroke-width="2"/>

  <text x="1205" y="479"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="15">
    Service Mismatch
  </text>

  <!-- Failure 5 -->
  <rect x="1025" y="525"
        width="360"
        height="55"
        rx="8"
        ry="8"
        fill="white"
        stroke="#555"
        stroke-width="2"/>

  <text x="1205" y="559"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="15">
    Expired / Invalid Decision
  </text>

  <!-- Failure 6 -->
  <rect x="1025" y="605"
        width="360"
        height="55"
        rx="8"
        ry="8"
        fill="white"
        stroke="#555"
        stroke-width="2"/>

  <text x="1205" y="639"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="15">
    Invalid Entitlement
  </text>

  <!-- Failure 7 -->
  <rect x="1025" y="685"
        width="360"
        height="55"
        rx="8"
        ry="8"
        fill="white"
        stroke="#555"
        stroke-width="2"/>

  <text x="1205" y="719"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="15">
    Invalid Policy
  </text>

  <!-- Failure 8 -->
  <rect x="1025" y="765"
        width="360"
        height="55"
        rx="8"
        ry="8"
        fill="white"
        stroke="#555"
        stroke-width="2"/>

  <text x="1205" y="799"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="15">
    Transaction Mismatch
  </text>

  <!-- Failure convergence -->
  <rect x="1025" y="870"
        width="360"
        height="75"
        rx="11"
        ry="11"
        fill="white"
        stroke="#222"
        stroke-width="3"/>

  <text x="1205" y="902"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="17"
        font-weight="bold">
    Binding Verification Failed
  </text>

  <text x="1205" y="926"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="13">
    Required applicability cannot be established
  </text>

  <!-- Failure arrows -->
  <line x1="1205" y1="260"
        x2="1205" y2="285"
        stroke="#555"
        stroke-width="2"
        marker-end="url(#arrow)"/>

  <line x1="1205" y1="340"
        x2="1205" y2="365"
        stroke="#555"
        stroke-width="2"
        marker-end="url(#arrow)"/>

  <line x1="1205" y1="420"
        x2="1205" y2="445"
        stroke="#555"
        stroke-width="2"
        marker-end="url(#arrow)"/>

  <line x1="1205" y1="500"
        x2="1205" y2="525"
        stroke="#555"
        stroke-width="2"
        marker-end="url(#arrow)"/>

  <line x1="1205" y1="580"
        x2="1205" y2="605"
        stroke="#555"
        stroke-width="2"
        marker-end="url(#arrow)"/>

  <line x1="1205" y1="660"
        x2="1205" y2="685"
        stroke="#555"
        stroke-width="2"
        marker-end="url(#arrow)"/>

  <line x1="1205" y1="740"
        x2="1205" y2="765"
        stroke="#555"
        stroke-width="2"
        marker-end="url(#arrow)"/>

  <line x1="1205" y1="820"
        x2="1205" y2="870"
        stroke="#555"
        stroke-width="2"
        marker-end="url(#arrow)"/>

  <!-- Failure → Deny -->
  <line x1="1205" y1="945"
        x2="1205" y2="1000"
        stroke="#555"
        stroke-width="2"
        marker-end="url(#arrow)"/>

  <rect x="1025" y="1000"
        width="360"
        height="75"
        rx="11"
        ry="11"
        fill="white"
        stroke="#222"
        stroke-width="3"/>

  <text x="1205" y="1032"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="20"
        font-weight="bold">
    DENY / FAIL-CLOSED
  </text>

  <text x="1205" y="1057"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="13">
    Protected execution is not permitted
  </text>

  <!-- Security invariant -->
  <rect x="1025" y="1110"
        width="360"
        height="100"
        rx="11"
        ry="11"
        fill="white"
        stroke="#555"
        stroke-width="2"/>

  <text x="1205" y="1143"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="17"
        font-weight="bold">
    Security Invariant
  </text>

  <text x="1205" y="1170"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="13">
    An unbound decision
  </text>

  <text x="1205" y="1191"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="13">
    SHALL NOT authorize execution
  </text>

  <!-- ====================================================== -->
  <!-- Footer                                                   -->
  <!-- ====================================================== -->

  <text x="750" y="1320"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="14">
    Protected Service Execution occurs only after successful decision binding verification.
  </text>

</svg>
