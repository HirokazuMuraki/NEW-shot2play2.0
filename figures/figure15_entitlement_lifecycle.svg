<?xml version="1.0" encoding="UTF-8"?>

<svg xmlns="http://www.w3.org/2000/svg"
     width="1900"
     height="2750"
     viewBox="0 0 1900 2750">

<title>Figure15 Entitlement Lifecycle</title>

<desc>
NEW-shot2play Protocol Suite Version 2.0
Entitlement Lifecycle Reference Model
</desc>

<rect x="0"
      y="0"
      width="1900"
      height="2750"
      fill="white"/>


<!-- ========================================================= -->
<!-- Title -->
<!-- ========================================================= -->

<text x="950"
      y="65"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="34"
      font-weight="bold">
Figure15 Entitlement Lifecycle
</text>

<text x="950"
      y="105"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="20">
NEW-shot2play Protocol Suite Version 2.0
</text>

<text x="950"
      y="137"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="16">
Entitlement Lifecycle Reference Model
</text>


<!-- ========================================================= -->
<!-- Fundamental Lifecycle -->
<!-- ========================================================= -->

<rect x="70"
      y="180"
      width="1760"
      height="300"
      rx="12"
      fill="white"
      stroke="black"
      stroke-width="4"/>

<text x="950"
      y="225"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="25"
      font-weight="bold">
Fundamental Entitlement Lifecycle
</text>

<text x="950"
      y="275"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="21"
      font-weight="bold">
Acquire → Hold → Use → Consume
</text>

<text x="950"
      y="320"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="19">
Hold → Expire
</text>

<text x="950"
      y="355"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="19">
Hold → Revoke
</text>

<text x="950"
      y="405"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="16">
Expire and Revoke are invalidation paths and SHALL prevent an
invalid Entitlement from producing an authorization Allow decision.
</text>


<!-- ========================================================= -->
<!-- Main Lifecycle -->
<!-- ========================================================= -->

<rect x="70"
      y="520"
      width="1120"
      height="1420"
      rx="12"
      fill="white"
      stroke="black"
      stroke-width="4"/>

<text x="630"
      y="570"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="25"
      font-weight="bold">
Entitlement State Lifecycle
</text>


<!-- Acquire -->

<rect x="335"
      y="620"
      width="590"
      height="145"
      fill="white"
      stroke="black"
      stroke-width="3"/>

<text x="630"
      y="665"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="23"
      font-weight="bold">
Acquire
</text>

<text x="630"
      y="705"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="15">
Entitlement is created or acquired
</text>

<text x="630"
      y="735"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="14">
Transaction / Event / Evidence establishes entitlement
</text>


<line x1="630"
      y1="765"
      x2="630"
      y2="810"
      stroke="black"
      stroke-width="3"/>

<polygon points="620,805 640,805 630,820"
         fill="black"/>


<!-- Hold -->

<rect x="335"
      y="820"
      width="590"
      height="155"
      fill="white"
      stroke="black"
      stroke-width="3"/>

<text x="630"
      y="865"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="23"
      font-weight="bold">
Hold
</text>

<text x="630"
      y="905"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="15">
Entitlement remains available
</text>

<text x="630"
      y="935"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="14">
Validity / Scope / Quantity / Usage Restrictions
</text>


<!-- Hold to Use -->

<line x1="630"
      y1="975"
      x2="630"
      y2="1020"
      stroke="black"
      stroke-width="3"/>

<polygon points="620,1015 640,1015 630,1030"
         fill="black"/>


<!-- Use -->

<rect x="335"
      y="1030"
      width="590"
      height="165"
      fill="white"
      stroke="black"
      stroke-width="3"/>

<text x="630"
      y="1075"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="23"
      font-weight="bold">
Use
</text>

<text x="630"
      y="1115"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="15">
Entitlement is evaluated for requested service action
</text>

<text x="630"
      y="1145"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="14">
State / Scope / Resource / Time / Revocation checked
</text>


<!-- Use to Consume -->

<line x1="630"
      y1="1195"
      x2="630"
      y2="1240"
      stroke="black"
      stroke-width="3"/>

<polygon points="620,1235 640,1235 630,1250"
         fill="black"/>


<!-- Consume -->

<rect x="335"
      y="1250"
      width="590"
      height="165"
      fill="white"
      stroke="black"
      stroke-width="3"/>

<text x="630"
      y="1295"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="23"
      font-weight="bold">
Consume
</text>

<text x="630"
      y="1335"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="15">
Consumable entitlement is consumed
</text>

<text x="630"
      y="1365"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="14">
Authoritative state and remaining quantity are updated
</text>


<!-- Completed -->

<line x1="630"
      y1="1415"
      x2="630"
      y2="1460"
      stroke="black"
      stroke-width="3"/>

<polygon points="620,1455 640,1455 630,1470"
         fill="black"/>

<rect x="335"
      y="1470"
      width="590"
      height="120"
      fill="white"
      stroke="black"
      stroke-width="3"/>

<text x="630"
      y="1515"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="21"
      font-weight="bold">
Entitlement Completed
</text>

<text x="630"
      y="1550"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="14">
Single-use entitlement cannot be consumed again
</text>


<!-- ========================================================= -->
<!-- Invalidation Paths -->
<!-- ========================================================= -->

<rect x="1240"
      y="520"
      width="590"
      height="730"
      rx="12"
      fill="white"
      stroke="black"
      stroke-width="4"/>

<text x="1535"
      y="570"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="25"
      font-weight="bold">
Invalidation Paths
</text>


<!-- Expire -->

<rect x="1295"
      y="630"
      width="480"
      height="175"
      fill="white"
      stroke="black"
      stroke-width="3"/>

<text x="1535"
      y="680"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="23"
      font-weight="bold">
Expire
</text>

<text x="1535"
      y="720"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="15">
Validity period has ended
</text>

<text x="1535"
      y="750"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="14">
Expiration SHALL prevent authorization Allow
</text>


<!-- Revoke -->

<rect x="1295"
      y="845"
      width="480"
      height="190"
      fill="white"
      stroke="black"
      stroke-width="3"/>

<text x="1535"
      y="895"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="23"
      font-weight="bold">
Revoke
</text>

<text x="1535"
      y="935"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="15">
Explicit invalidation before expiration
</text>

<text x="1535"
      y="965"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="14">
Security / Administration / User Request
</text>


<line x1="1535"
      y1="1035"
      x2="1535"
      y2="1080"
      stroke="black"
      stroke-width="3"/>

<polygon points="1525,1075 1545,1075 1535,1090"
         fill="black"/>


<rect x="1295"
      y="1090"
      width="480"
      height="115"
      fill="white"
      stroke="black"
      stroke-width="3"/>

<text x="1535"
      y="1135"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="20"
      font-weight="bold">
Authorization Blocked
</text>

<text x="1535"
      y="1168"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="14">
Invalid entitlement cannot produce Allow
</text>


<!-- ========================================================= -->
<!-- Authorization Interaction -->
<!-- ========================================================= -->

<rect x="1240"
      y="1290"
      width="590"
      height="650"
      rx="12"
      fill="white"
      stroke="black"
      stroke-width="4"/>

<text x="1535"
      y="1340"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="25"
      font-weight="bold">
Authorization Interaction
</text>


<text x="1535"
      y="1400"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="18"
      font-weight="bold">
Authenticated Identity
</text>

<text x="1535"
      y="1435"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="18">
↓
</text>

<text x="1535"
      y="1470"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="18"
      font-weight="bold">
Entitlement Lookup
</text>

<text x="1535"
      y="1505"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="18">
↓
</text>

<text x="1535"
      y="1540"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="18"
      font-weight="bold">
State Validation
</text>

<text x="1535"
      y="1575"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="18">
↓
</text>

<text x="1535"
      y="1610"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="18"
      font-weight="bold">
Revocation / Expiration Check
</text>

<text x="1535"
      y="1645"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="18">
↓
</text>

<text x="1535"
      y="1680"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="18"
      font-weight="bold">
Policy Evaluation
</text>

<text x="1535"
      y="1715"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="18">
↓
</text>

<text x="1535"
      y="1750"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="19"
      font-weight="bold">
Authorization Decision
</text>

<text x="1535"
      y="1795"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="15">
Authoritative Entitlement State is used
</text>


<!-- ========================================================= -->
<!-- Quantity Example -->
<!-- ========================================================= -->

<rect x="70"
      y="1990"
      width="1120"
      height="450"
      rx="12"
      fill="white"
      stroke="black"
      stroke-width="4"/>

<text x="630"
      y="2040"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="25"
      font-weight="bold">
Quantity-Based Entitlement
</text>


<text x="630"
      y="2095"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="20"
      font-weight="bold">
10 Uses
</text>

<text x="630"
      y="2130"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="18">
↓
</text>

<text x="630"
      y="2165"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="20">
Use → 9 Uses
</text>

<text x="630"
      y="2200"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="18">
↓
</text>

<text x="630"
      y="2235"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="20">
Use → 8 Uses
</text>

<text x="630"
      y="2270"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="18">
↓
</text>

<text x="630"
      y="2305"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="20">
Remaining Quantity = 0 → Unavailable
</text>

<text x="630"
      y="2350"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="14">
Authoritative state SHALL prevent consumption beyond the available quantity.
</text>


<!-- ========================================================= -->
<!-- Multiple Entitlement Example -->
<!-- ========================================================= -->

<rect x="1240"
      y="1990"
      width="590"
      height="450"
      rx="12"
      fill="white"
      stroke="black"
      stroke-width="4"/>

<text x="1535"
      y="2040"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="25"
      font-weight="bold">
Multiple Entitlements
</text>

<text x="1535"
      y="2100"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="19"
      font-weight="bold">
Entitlement A
</text>

<text x="1535"
      y="2135"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="18">
+
</text>

<text x="1535"
      y="2170"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="19"
      font-weight="bold">
Entitlement B
</text>

<text x="1535"
      y="2205"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="18">
↓
</text>

<text x="1535"
      y="2240"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="19"
      font-weight="bold">
Policy Evaluation
</text>

<text x="1535"
      y="2275"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="18">
↓
</text>

<text x="1535"
      y="2310"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="20"
      font-weight="bold">
Authorization
</text>

<text x="1535"
      y="2355"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="14">
Policy determines whether A AND B,
</text>

<text x="1535"
      y="2380"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="14">
A OR B, or another relationship applies.
</text>


<!-- ========================================================= -->
<!-- Version 2.0 Example -->
<!-- ========================================================= -->

<rect x="70"
      y="2490"
      width="1760"
      height="180"
      rx="12"
      fill="white"
      stroke="black"
      stroke-width="4"/>

<text x="950"
      y="2535"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="23"
      font-weight="bold">
Version 2.0 Example
</text>

<text x="950"
      y="2580"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="18">
Visit Evidence → Acquire Entitlement → Hold Discount Entitlement
</text>

<text x="950"
      y="2615"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="18">
→ EC Authorization → Allow → Consume → Entitlement Completed
</text>


<!-- ========================================================= -->
<!-- Footer -->
<!-- ========================================================= -->

<text x="950"
      y="2710"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="15">
Entitlement state is authoritative for authorization and consumption control.
</text>


</svg>
