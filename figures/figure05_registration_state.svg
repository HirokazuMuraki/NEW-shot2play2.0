<?xml version="1.0" encoding="UTF-8"?>

<svg xmlns="http://www.w3.org/2000/svg"
     width="1400"
     height="1700"
     viewBox="0 0 1400 1700">

<title>Figure05 Registration State Transition</title>

<desc>
NEW-shot2play Protocol Suite Version 2.0
Registration Lifecycle State Model
</desc>

<rect x="0"
      y="0"
      width="1400"
      height="1700"
      fill="white"/>


<!-- Title -->

<text x="700"
      y="60"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="32"
      font-weight="bold">
Figure05 Registration State Transition
</text>

<text x="700"
      y="100"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="20">
NEW-shot2play Protocol Suite Version 2.0
</text>


<!-- Left State Machine -->

<text x="350"
      y="160"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="24"
      font-weight="bold">
Registration State Machine
</text>


<rect x="150" y="220"
      width="400" height="90"
      fill="white"
      stroke="black"
      stroke-width="2"/>

<text x="350" y="275"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="22"
      font-weight="bold">
Initial
</text>


<line x1="350" y1="310"
      x2="350" y2="360"
      stroke="black"
      stroke-width="3"/>

<polygon points="340,355 360,355 350,370"
         fill="black"/>


<rect x="150" y="370"
      width="400" height="100"
      fill="white"
      stroke="black"
      stroke-width="2"/>

<text x="350" y="430"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="21"
      font-weight="bold">
Registration Requested
</text>


<line x1="350" y1="470"
      x2="350" y2="520"
      stroke="black"
      stroke-width="3"/>

<polygon points="340,515 360,515 350,530"
         fill="black"/>


<rect x="150" y="530"
      width="400" height="100"
      fill="white"
      stroke="black"
      stroke-width="2"/>

<text x="350" y="590"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="21"
      font-weight="bold">
Identity Verified
</text>


<line x1="350" y1="630"
      x2="350" y2="680"
      stroke="black"
      stroke-width="3"/>

<polygon points="340,675 360,675 350,690"
         fill="black"/>


<rect x="150" y="690"
      width="400" height="110"
      fill="white"
      stroke="black"
      stroke-width="3"/>

<text x="350" y="740"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="21"
      font-weight="bold">
Credential Registered
</text>

<text x="350" y="775"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="15">
Public Verification Data
</text>


<line x1="350" y1="800"
      x2="350" y2="850"
      stroke="black"
      stroke-width="3"/>

<polygon points="340,845 360,845 350,860"
         fill="black"/>


<rect x="150" y="860"
      width="400" height="110"
      fill="white"
      stroke="black"
      stroke-width="3"/>

<text x="350" y="910"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="21"
      font-weight="bold">
Device Bound
</text>

<text x="350" y="945"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="15">
Trusted Device Relationship
</text>


<line x1="350" y1="970"
      x2="350" y2="1020"
      stroke="black"
      stroke-width="3"/>

<polygon points="340,1015 360,1015 350,1030"
         fill="black"/>


<rect x="150" y="1030"
      width="400"
      height="110"
      fill="white"
      stroke="black"
      stroke-width="3"/>

<text x="350" y="1080"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="21"
      font-weight="bold">
Registration Completed
</text>

<text x="350" y="1115"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="15">
Authentication Ready
</text>



<!-- Security Control -->

<text x="1000"
      y="160"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="24"
      font-weight="bold">
Security Control
</text>


<rect x="800"
      y="220"
      width="400"
      height="520"
      fill="white"
      stroke="black"
      stroke-width="3"/>


<text x="1000"
      y="300"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="18">
Security Incident
</text>


<text x="1000"
      y="360"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="18">
Device Replacement
</text>


<text x="1000"
      y="420"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="18">
User Request
</text>


<text x="1000"
      y="500"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="22">
↓
</text>


<rect x="860"
      y="550"
      width="280"
      height="110"
      fill="white"
      stroke="black"
      stroke-width="2"/>


<text x="1000"
      y="600"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="22"
      font-weight="bold">
Revoked
</text>


<text x="1000"
      y="635"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="15">
Registration Terminated
</text>



<!-- Version 2 Extension -->

<rect x="800"
      y="820"
      width="400"
      height="420"
      fill="white"
      stroke="black"
      stroke-width="3"/>


<text x="1000"
      y="880"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="22"
      font-weight="bold">
Version 2.0 Extension
</text>


<text x="1000"
      y="960"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="18">
Registration Completed
</text>


<text x="1000"
      y="1020"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="20">
↓
</text>


<text x="1000"
      y="1080"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="18">
Entitlement Context
</text>


<text x="1000"
      y="1140"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="20">
↓
</text>


<text x="1000"
      y="1200"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="18">
Authorization Capability
</text>


<!-- Footer -->

<text x="700"
      y="1500"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="18">
Registration Lifecycle Control Model
</text>


</svg>
