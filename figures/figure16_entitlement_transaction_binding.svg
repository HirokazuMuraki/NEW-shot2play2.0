Version 2.0 Example
</text>

<text x="950"
      y="2610"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="17">
T1: Visit Transaction → E1: Visit Evidence → Q1: Discount Entitlement Created
</text>

<text x="950"
      y="2645"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="17">
T2: EC Authorization Request → Allow → T3: Consumption → Q1 State Updated
</text>

<text x="950"
      y="2680"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="14">
T1, T2, and T3 remain independently identifiable while remaining causally linked.
</text>


