</text>

<text x="950"
      y="2380"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="14">
Failure after Allow SHALL be handled according to the applicable Service Profile.
</text>


<!-- ========================================================= -->
<!-- Version 2.0 Example -->
<!-- ========================================================= -->

<rect x="70"
      y="2520"
      width="1760"
      height="210"
      rx="12"
      fill="white"
      stroke="black"
      stroke-width="4"/>

<text x="950"
      y="2565"
      text-anchor="middle"
      font-family="Arial, sans-serif"
