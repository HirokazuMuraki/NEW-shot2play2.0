<text x="950"
      y="2225"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="14">
Unique transaction / idempotency reference
</text>

<text x="950"
      y="2255"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="14">
Consumption occurs only after Allow
</text>


<line x1="1220"
      y1="2212"
      x2="1340"
      y2="2212"
      stroke="black"
      stroke-width="3"/>

<polygon points="1335,2202 1335,2222 1355,2212"
         fill="black"/>


<rect x="1355"
      y="2140"
      width="400"
      height="145"
      fill="white"
      stroke="black"
      stroke-width="3"/>

<text x="1555"
      y="2185"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="21"
      font-weight="bold">
Entitlement State Update
</text>

<text x="1555"
      y="2225"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="14">
Quantity / Usage / State
</text>

<text x="1555"
      y="2255"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="14">
State update references causative transaction
</text>


<text x="950"
      y="2345"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="15">
