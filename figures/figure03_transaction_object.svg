      font-family="Arial, sans-serif"
      font-size="22"
      font-weight="bold">
Authentication Object
</text>

<text x="850"
      y="385"
      font-family="Arial, sans-serif"
      font-size="14">
Identity verification result
</text>


<text x="850"
      y="480"
      font-family="Arial, sans-serif"
      font-size="22"
      font-weight="bold">
Entitlement Object
</text>

<text x="850"
      y="515"
      font-family="Arial, sans-serif"
      font-size="14">
Rights and qualifications
</text>


<text x="850"
      y="610"
      font-family="Arial, sans-serif"
      font-size="22"
      font-weight="bold">
Policy Object
</text>

<text x="850"
      y="645"
      font-family="Arial, sans-serif"
      font-size="14">
Decision conditions
</text>


<text x="850"
      y="740"
      font-family="Arial, sans-serif"
      font-size="22"
      font-weight="bold">
Authorization Object
</text>

<text x="850"
      y="775"
      font-family="Arial, sans-serif"
      font-size="14">
Final permission result
</text>



<!-- Scenario D -->

<rect x="800"
      y="980"
      width="450"
      height="460"
      fill="white"
      stroke="black"
      stroke-width="3"/>


<text x="1025"
      y="1030"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="24"
      font-weight="bold">
Scenario D
</text>

<text x="1025"
      y="1070"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="18">
Visit Based Entitlement
</text>


<text x="1025"
      y="1150"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="18">
Visit Evidence
</text>

<text x="1025"
      y="1200"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="20">
↓
</text>


<text x="1025"
      y="1270"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="18">
Discount Entitlement
</text>

<text x="1025"
      y="1320"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="20">
↓
</text>


<text x="1025"
      y="1390"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="18">
EC Authorization
</text>


<!-- Footer -->

<text x="700"
      y="1550"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="18">
Authentication Object → Entitlement Object → Policy Object → Authorization Object
</text>


</svg>
