Service Execution Target
</text>



<!-- Object Responsibility -->

<rect x="800"
      y="220"
      width="450"
      height="700"
      fill="white"
      stroke="black"
      stroke-width="2"/>


<text x="1025"
      y="275"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="24"
      font-weight="bold">
Object Responsibility
</text>


<text x="850"
