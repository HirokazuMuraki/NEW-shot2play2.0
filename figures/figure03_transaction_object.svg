<rect x="150" y="610" width="400" height="120"
      fill="white" stroke="black" stroke-width="3"/>

<text x="350" y="665"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="22"
      font-weight="bold">
Policy Object
</text>

<text x="350" y="705"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="16">
Evaluation Rules
</text>


<line x1="350" y1="730"
      x2="350" y2="790"
      stroke="black"
      stroke-width="3"/>

<polygon points="340,785 360,785 350,800"
         fill="black"/>


<rect x="150" y="800" width="400" height="130"
      fill="white" stroke="black" stroke-width="3"/>

<text x="350" y="855"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="22"
      font-weight="bold">
Authorization Object
</text>

<text x="350" y="895"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="16">
Permit / Deny Decision
</text>


<line x1="350" y1="930"
      x2="350" y2="990"
      stroke="black"
      stroke-width="3"/>

<polygon points="340,985 360,985 350,1000"
