<?xml version="1.0" encoding="UTF-8"?>

<svg xmlns="http://www.w3.org/2000/svg"
     width="1400"
     height="1700"
     viewBox="0 0 1400 1700">

<title>Figure03 Transaction Object Model</title>

<desc>
NEW-shot2play Protocol Suite Version 2.0
Protocol Object Relationship Model
</desc>


<rect x="0"
      y="0"
      width="1400"
      height="1700"
      fill="white"/>


<!-- Title -->

<text x="700"
      y="60"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="32"
      font-weight="bold">
Figure03 Transaction Object Model
</text>

<text x="700"
      y="100"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="20">
NEW-shot2play Protocol Suite Version 2.0
</text>


<!-- Main Object Chain -->

<text x="350"
      y="160"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="24"
      font-weight="bold">
Protocol Object Chain
</text>


<!-- Object boxes -->

<rect x="150" y="220" width="400" height="120"
      fill="white" stroke="black" stroke-width="2"/>

<text x="350" y="275"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="22"
      font-weight="bold">
Authentication Object
</text>

<text x="350" y="315"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="16">
Identity Assurance
</text>


<line x1="350" y1="340"
      x2="350" y2="400"
      stroke="black"
      stroke-width="3"/>

<polygon points="340,395 360,395 350,410"
         fill="black"/>


<rect x="150" y="410" width="400" height="130"
      fill="white" stroke="black" stroke-width="3"/>

<text x="350" y="465"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="22"
      font-weight="bold">
Entitlement Object
</text>

<text x="350" y="505"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="16">
Rights and Conditions
</text>


<line x1="350" y1="540"
      x2="350" y2="600"
      stroke="black"
      stroke-width="3"/>

<polygon points="340,595 360,595 350,610"
