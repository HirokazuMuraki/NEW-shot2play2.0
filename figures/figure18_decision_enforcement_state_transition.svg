<?xml version="1.0" encoding="UTF-8"?>

<svg xmlns="http://www.w3.org/2000/svg"
     width="1900"
     height="3000"
     viewBox="0 0 1900 3000">

<title>Figure18 Decision Enforcement and State Transition</title>

<desc>
NEW-shot2play Protocol Suite Version 2.0
Decision Enforcement and State Transition
</desc>

<rect x="0" y="0" width="1900" height="3000" fill="white"/>

<!-- ========================================================= -->
<!-- Title -->
<!-- ========================================================= -->

<text x="950" y="65"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="34"
      font-weight="bold">
Figure18 Decision Enforcement and State Transition
</text>

<text x="950" y="105"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="20">
NEW-shot2play Protocol Suite Version 2.0
</text>

<text x="950" y="137"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="16">
Authorization Decision → Enforcement → Service → Consumption → State
</text>


<!-- ========================================================= -->
<!-- Fundamental Model -->
<!-- ========================================================= -->

<rect x="70" y="180"
      width="1760" height="340"
      rx="12"
      fill="white"
      stroke="black"
      stroke-width="4"/>

<text x="950" y="225"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="25"
      font-weight="bold">
Fundamental Decision Enforcement Model
</text>

<text x="950" y="275"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="19"
      font-weight="bold">
Authorization Request
</text>

<text x="950" y="310"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="17">
↓
</text>

<text x="950" y="340"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="19"
      font-weight="bold">
Authorization Evaluation
</text>

<text x="950" y="375"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="17">
↓
</text>

<text x="950" y="405"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="19"
      font-weight="bold">
Authorization Decision
</text>

<text x="950" y="440"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="17">
↓
</text>

<text x="950" y="475"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="19"
      font-weight="bold">
Service Enforcement Point
</text>


<!-- ========================================================= -->
<!-- Decision Branch -->
<!-- ========================================================= -->

<rect x="70" y="570"
      width="1760" height="610"
      rx="12"
      fill="white"
      stroke="black"
      stroke-width="4"/>

<text x="950" y="620"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="25"
      font-weight="bold">
Authorization Decision Branch
</text>


<!-- Allow -->
<rect x="170" y="680"
      width="650" height="420"
      rx="10"
      fill="white"
      stroke="black"
      stroke-width="4"/>

<text x="495" y="730"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="24"
      font-weight="bold">
ALLOW
</text>

<text x="495" y="765"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="15">
Requested action is permitted
</text>

<line x1="495" y1="790"
      x2="495" y2="835"
      stroke="black"
      stroke-width="3"/>

<polygon points="485,830 505,830 495,845"
         fill="black"/>

<rect x="250" y="845"
      width="490" height="90"
      fill="white"
      stroke="black"
      stroke-width="3"/>

<text x="495" y="900"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="19"
      font-weight="bold">
Service Action Permitted
</text>

<line x1="495" y1="935"
      x2="495" y2="980"
      stroke="black"
      stroke-width="3"/>

<polygon points="485,975 505,975 495,990"
         fill="black"/>

<text x="495" y="1035"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="16"
      font-weight="bold">
Proceed to Service Enforcement
</text>


<!-- Deny -->
<rect x="1080" y="680"
      width="650" height="420"
      rx="10"
      fill="white"
      stroke="black"
      stroke-width="4"/>

<text x="1405" y="730"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="24"
      font-weight="bold">
DENY
</text>

<text x="1405" y="765"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="15">
Requested action is not permitted
</text>

<line x1="1405" y1="790"
      x2="1405" y2="835"
      stroke="black"
      stroke-width="3"/>

<polygon points="1395,830 1415,830 1405,845"
         fill="black"/>

<rect x="1160" y="845"
      width="490" height="90"
      fill="white"
      stroke="black"
      stroke-width="3"/>

<text x="1405" y="900"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="19"
      font-weight="bold">
Service Action Blocked
</text>

<line x1="1405" y1="935"
      x2="1405"
      y2="980"
      stroke="black"
      stroke-width="3"/>

<polygon points="1395,975 1415,975 1405,990"
         fill="black"/>

<text x="1405" y="1035"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="16"
      font-weight="bold">
No Consumption
</text>


<!-- ========================================================= -->
<!-- Enforcement Flow -->
<!-- ========================================================= -->

<rect x="70" y="1230"
      width="1760" height="760"
      rx="12"
      fill="white"
      stroke="black"
      stroke-width="4"/>

<text x="950" y="1280"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="25"
      font-weight="bold">
Allow Path — Enforcement and Consumption
</text>


<!-- Enforcement -->
<rect x="125" y="1340"
      width="390" height="185"
      fill="white"
      stroke="black"
      stroke-width="3"/>

<text x="320" y="1385"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="20"
      font-weight="bold">
Service Enforcement Point
</text>

<text x="320" y="1425"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="14">
Decision validity / binding
</text>

<text x="320" y="1455"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="14">
Subject / Action / Resource
</text>

<text x="320" y="1485"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="14">
Decision expiration / transaction state
</text>


<!-- Service -->
<rect x="575" y="1340"
      width="390" height="185"
      fill="white"
      stroke="black"
      stroke-width="3"/>

<text x="770" y="1385"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="20"
      font-weight="bold">
Service Action
</text>

<text x="770" y="1425"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="14">
Protected operation
</text>

<text x="770" y="1455"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="14">
Executed only after applicable Allow
</text>

<text x="770" y="1485"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="14">
Service result generated
</text>


<!-- Consumption -->
<rect x="1025" y="1340"
      width="390" height="185"
      fill="white"
      stroke="black"
      stroke-width="3"/>

<text x="1220" y="1385"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="20"
      font-weight="bold">
Consumption Transaction
</text>

<text x="1220" y="1425"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="14">
Transaction ID
</text>

<text x="1220" y="1455"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="14">
Authorization / Entitlement Reference
</text>

<text x="1220" y="1485"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="14">
Quantity / Time / Service Result
</text>


<!-- State Update -->
<rect x="1475" y="1340"
      width="300" height="185"
      fill="white"
      stroke="black"
      stroke-width="3"/>

<text x="1625" y="1385"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="19"
      font-weight="bold">
Entitlement State
</text>

<text x="1625" y="1418"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="19"
      font-weight="bold">
Update
</text>

<text x="1625" y="1455"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="13">
Remaining Quantity
</text>

<text x="1625" y="1483"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="13">
Usage / Consumption State
</text>

<text x="1625" y="1511"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="13">
State Revision
</text>


<!-- Horizontal arrows -->

<line x1="515" y1="1432"
      x2="555" y2="1432"
      stroke="black"
      stroke-width="3"/>

<polygon points="550,1422 550,1442 565,1432"
         fill="black"/>

<line x1="965" y1="1432"
      x2="1005" y2="1432"
      stroke="black"
      stroke-width="3"/>

<polygon points="1000,1422 1000,1442 1015,1432"
         fill="black"/>

<line x1="1415" y1="1432"
      x2="1455" y2="1432"
      stroke="black"
      stroke-width="3"/>

<polygon points="1450,1422 1450,1442 1465,1432"
         fill="black"/>


<!-- State transition detail -->

<rect x="180" y="1600"
      width="1540" height="300"
      fill="white"
      stroke="black"
      stroke-width="3"/>

<text x="950" y="1645"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="21"
      font-weight="bold">
Successful State Transition
</text>

<text x="950" y="1695"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="17"
      font-weight="bold">
Pre-Consumption State
</text>

<text x="950" y="1725"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="15">
↓
</text>

<text x="950" y="1755"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="17"
      font-weight="bold">
Authorization = Allow
</text>

<text x="950" y="1785"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="15">
↓
</text>

<text x="950" y="1815"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="17"
      font-weight="bold">
Service Action Successful → Consumption Recorded
</text>

<text x="950" y="1845"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="15">
↓
</text>

<text x="950" y="1875"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="17"
      font-weight="bold">
Post-Consumption State
</text>


<!-- ========================================================= -->
<!-- Decision Binding -->
<!-- ========================================================= -->

<rect x="70" y="2040"
      width="850" height="500"
      rx="12"
      fill="white"
      stroke="black"
      stroke-width="4"/>

<text x="495" y="2090"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="24"
      font-weight="bold">
Authorization Result Binding
</text>

<rect x="135" y="2140"
      width="720" height="170"
      fill="white"
      stroke="black"
      stroke-width="3"/>

<text x="495" y="2185"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="19"
      font-weight="bold">
Binding Attributes
</text>

<text x="495" y="2225"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="14">
Subject / Action / Resource / Service
</text>

<text x="495" y="2255"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="14">
Entitlement / Authorization Request
</text>

<text x="495" y="2285"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="14">
Decision Time / Expiration / Policy Version
</text>

<text x="495" y="2340"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="16"
      font-weight="bold">
Mismatch → Result SHALL NOT be accepted
</text>


<rect x="135" y="2370"
      width="720" height="115"
      fill="white"
      stroke="black"
      stroke-width="3"/>

<text x="495" y="2415"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="18"
      font-weight="bold">
Expired Decision
</text>

<text x="495" y="2450"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="14">
Not Applicable → New Evaluation MAY be required
</text>


<!-- ========================================================= -->
<!-- Idempotency / Concurrency -->
<!-- ========================================================= -->

<rect x="980" y="2040"
      width="850" height="500"
      rx="12"
      fill="white"
      stroke="black"
      stroke-width="4"/>

<text x="1405" y="2090"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="24"
      font-weight="bold">
Consumption Integrity
</text>

<rect x="1045" y="2140"
      width="720" height="145"
      fill="white"
      stroke="black"
      stroke-width="3"/>

<text x="1405" y="2185"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="19"
      font-weight="bold">
Idempotency
</text>

<text x="1405" y="2225"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="14">
Consumption Transaction ID as idempotency key
</text>

<text x="1405" y="2255"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="14">
Same operation SHALL NOT consume twice
</text>


<rect x="1045" y="2310"
      width="720"
      height="145"
      fill="white"
      stroke="black"
      stroke-width="3"/>

<text x="1405" y="2355"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="19"
      font-weight="bold">
Concurrency Control
</text>

<text x="1405" y="2395"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="14">
Prevent double consumption
</text>

<text x="1405" y="2425"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="14">
Prevent negative quantity / lost updates
</text>


<!-- ========================================================= -->
<!-- Version 2.0 Example -->
<!-- ========================================================= -->

<rect x="70" y="2590"
      width="1760" height="290"
      rx="12"
      fill="white"
      stroke="black"
      stroke-width="4"/>

<text x="950" y="2635"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="24"
      font-weight="bold">
Version 2.0 Example
</text>

<text x="950" y="2680"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="16"
      font-weight="bold">
Visit Evidence → Discount Entitlement → EC Authorization
</text>

<text x="950" y="2710"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="15">
↓
</text>

<text x="950" y="2740"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="16"
      font-weight="bold">
Authorization = Allow → Service Enforcement Point
</text>

<text x="950" y="2770"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="15">
↓
</text>

<text x="950" y="2800"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="16"
      font-weight="bold">
Discount Applied → Consumption Transaction → Entitlement State Updated
</text>

<text x="950" y="2830"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="13">
Deny → Discount Not Applied → No Consumption
</text>


</svg>
