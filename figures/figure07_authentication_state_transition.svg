<?xml version="1.0" encoding="UTF-8"?>

<svg xmlns="http://www.w3.org/2000/svg"
     width="1600"
     height="1900"
     viewBox="0 0 1600 1900">

<title>Figure07 Authentication State Transition</title>

<desc>
NEW-shot2play Protocol Suite Version 2.0
Authentication State Transition Model
</desc>

<rect x="0"
      y="0"
      width="1600"
      height="1900"
      fill="white"/>


<!-- ========================================================= -->
<!-- Title -->
<!-- ========================================================= -->

<text x="800"
      y="60"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="32"
      font-weight="bold">
Figure07 Authentication State Transition
</text>

<text x="800"
      y="100"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="20">
NEW-shot2play Protocol Suite Version 2.0
</text>


<!-- ========================================================= -->
<!-- Main State Transition -->
<!-- ========================================================= -->

<text x="520"
      y="165"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="25"
      font-weight="bold">
Authentication State Machine
</text>


<!-- Authentication Requested -->

<rect x="260"
      y="220"
      width="520"
      height="100"
      fill="white"
      stroke="black"
      stroke-width="3"/>

<text x="520"
      y="280"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="21"
      font-weight="bold">
Authentication Requested
</text>


<line x1="520"
      y1="320"
      x2="520"
      y2="370"
      stroke="black"
      stroke-width="3"/>

<polygon points="510,365 530,365 520,380"
         fill="black"/>


<!-- QR Presented -->

<rect x="260"
      y="380"
      width="520"
      height="100"
      fill="white"
      stroke="black"
      stroke-width="3"/>

<text x="520"
      y="440"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="21"
      font-weight="bold">
QR Presented
</text>


<line x1="520"
      y1="480"
      x2="520"
      y2="530"
      stroke="black"
      stroke-width="3"/>

<polygon points="510,525 530,525 520,540"
         fill="black"/>


<!-- Challenge Issued -->

<rect x="260"
      y="540"
      width="520"
      height="100"
      fill="white"
      stroke="black"
      stroke-width="3"/>

<text x="520"
      y="600"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="21"
      font-weight="bold">
Challenge Issued
</text>


<line x1="520"
      y1="640"
      x2="520"
      y2="690"
      stroke="black"
      stroke-width="3"/>

<polygon points="510,685 530,685 520,700"
         fill="black"/>


<!-- Response Submitted -->

<rect x="260"
      y="700"
      width="520"
      height="100"
      fill="white"
      stroke="black"
      stroke-width="3"/>

<text x="520"
      y="760"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="21"
      font-weight="bold">
Response Submitted
</text>


<line x1="520"
      y1="800"
      x2="520"
      y2="850"
      stroke="black"
      stroke-width="3"/>

<polygon points="510,845 530,845 520,860"
         fill="black"/>


<!-- Verification -->

<rect x="260"
      y="860"
      width="520"
      height="110"
      fill="white"
      stroke="black"
      stroke-width="3"/>

<text x="520"
      y="910"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="22"
      font-weight="bold">
Verification
</text>

<text x="520"
      y="945"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="16">
Transaction / Token / Credential / Signature
</text>


<!-- ========================================================= -->
<!-- Verification Success -->
<!-- ========================================================= -->

<line x1="780"
      y1="915"
      x2="920"
      y2="915"
      stroke="black"
      stroke-width="3"/>

<polygon points="910,905 910,925 930,915"
         fill="black"/>

<text x="850"
      y="890"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="15"
      font-weight="bold">
Valid
</text>


<rect x="930"
      y="860"
      width="420"
      height="110"
      fill="white"
      stroke="black"
      stroke-width="3"/>

<text x="1140"
      y="910"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="22"
      font-weight="bold">
Authenticated
</text>

<text x="1140"
      y="945"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="16">
Authentication Established
</text>


<!-- ========================================================= -->
<!-- Verification Rejected -->
<!-- ========================================================= -->

<line x1="260"
      y1="915"
      x2="100"
      y2="915"
      stroke="black"
      stroke-width="3"/>

<polygon points="110,905 110,925 90,915"
         fill="black"/>

<text x="180"
      y="890"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="15"
      font-weight="bold">
Invalid
</text>


<rect x="40"
      y="860"
      width="220"
      height="110"
      fill="white"
      stroke="black"
      stroke-width="3"/>

<text x="150"
      y="910"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="21"
      font-weight="bold">
Rejected
</text>

<text x="150"
      y="945"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="15">
Authentication Failed
</text>


<!-- ========================================================= -->
<!-- Consumed -->
<!-- ========================================================= -->

<line x1="1140"
      y1="970"
      x2="1140"
      y2="1030"
      stroke="black"
      stroke-width="3"/>

<polygon points="1130,1025 1150,1025 1140,1040"
         fill="black"/>

<text x="1140"
      y="1010"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="14"
      font-weight="bold">
Token Consumed
</text>


<rect x="930"
      y="1040"
      width="420"
      height="110"
      fill="white"
      stroke="black"
      stroke-width="3"/>

<text x="1140"
      y="1090"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="22"
      font-weight="bold">
Consumed
</text>

<text x="1140"
      y="1125"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="15">
One-Time Token Cannot Be Reused
</text>


<!-- ========================================================= -->
<!-- Expired Control -->
<!-- ========================================================= -->

<rect x="930"
      y="220"
      width="420"
      height="480"
      fill="white"
      stroke="black"
      stroke-width="3"/>

<text x="1140"
      y="275"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="23"
      font-weight="bold">
Expiration Control
</text>


<text x="1140"
      y="335"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="18">
Active Authentication
</text>

<line x1="1140"
      y1="355"
      x2="1140"
      y2="405"
      stroke="black"
      stroke-width="3"/>

<polygon points="1130,400 1150,400 1140,415"
         fill="black"/>

<text x="1140"
      y="455"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="20"
      font-weight="bold">
Validity Period Ends
</text>

<line x1="1140"
      y1="475"
      x2="1140"
      y2="525"
      stroke="black"
      stroke-width="3"/>

<polygon points="1130,520 1150,520 1140,535"
         fill="black"/>


<rect x="1000"
      y="540"
      width="280"
      height="110"
      fill="white"
      stroke="black"
      stroke-width="2"/>

<text x="1140"
      y="590"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="22"
      font-weight="bold">
Expired
</text>

<text x="1140"
      y="625"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="15">
Authentication Terminated
</text>


<!-- ========================================================= -->
<!-- Replay Rejection -->
<!-- ========================================================= -->

<rect x="40"
      y="1040"
      width="220"
      height="180"
      fill="white"
      stroke="black"
      stroke-width="3"/>

<text x="150"
      y="1090"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="20"
      font-weight="bold">
Replay Attempt
</text>

<text x="150"
      y="1130"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="15">
Consumed Token
</text>

<text x="150"
      y="1160"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="18">
↓
</text>

<text x="150"
      y="1195"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="19"
      font-weight="bold">
Rejected
</text>


<!-- ========================================================= -->
<!-- Terminal State Explanation -->
<!-- ========================================================= -->

<rect x="300"
      y="1250"
      width="800"
      height="180"
      fill="white"
      stroke="black"
      stroke-width="3"/>

<text x="700"
      y="1300"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="23"
      font-weight="bold">
Terminal State Control
</text>

<text x="700"
      y="1345"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="17">
Authenticated / Expired / Rejected / Consumed
</text>

<text x="700"
      y="1380"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="15">
Terminal states cannot return to an earlier authentication state.
</text>


<!-- ========================================================= -->
<!-- Version 2.0 Extension -->
<!-- ========================================================= -->

<rect x="250"
      y="1490"
      width="1100"
      height="350"
      fill="white"
      stroke="black"
      stroke-width="3"/>

<text x="800"
      y="1545"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="24"
      font-weight="bold">
Version 2.0 Authorization Extension
</text>


<text x="800"
      y="1605"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="19"
      font-weight="bold">
Authenticated
</text>


<line x1="800"
      y1="1625"
      x2="800"
      y2="1655"
      stroke="black"
      stroke-width="3"/>

<polygon points="790,1650 810,1650 800,1665"
         fill="black"/>


<text x="800"
      y="1705"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="19"
      font-weight="bold">
Entitlement Context
</text>


<line x1="800"
      y1="1725"
      x2="800"
      y2="1755"
      stroke="black"
      stroke-width="3"/>

<polygon points="790,1750 810,1750 800,1765"
         fill="black"/>


<text x="800"
      y="1805"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="19"
      font-weight="bold">
Policy Evaluation → Authorization Decision
</text>


</svg>
