Authentication establishes identity assurance; authorization determines permitted actions.
</text>


<!-- ========================================================= -->
<!-- Security Architecture Flow -->
<!-- ========================================================= -->

<text x="800"
      y="1285"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="17"
      font-weight="bold">
Security Responsibility Flow
</text>


<line x1="800"
      y1="1550"
      x2="800"
      y2="1590"
      stroke="black"
      stroke-width="3"/>

<polygon points="790,1585 810,1585 800,1600"
         fill="black"/>


</svg>
